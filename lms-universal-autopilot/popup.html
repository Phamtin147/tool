<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>LMS AutoPilot Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-row">
      <span class="logo">⚡</span>
      <h2>LMS AutoPilot</h2>
    </div>
    <span class="badge">v1.0 Pro</span>
  </div>

  <div class="content">
    <div class="form-group">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off">
    </div>

    <div class="form-group">
      <label for="modelSelect">Gemini Model</label>
      <select id="modelSelect">
        <option value="gemini-flash-latest">Gemini Flash Latest (Chuẩn nhất)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Ultra Fast)</option>
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
      </select>
    </div>

    <div class="form-group">
      <label for="modeSelect">Chế độ giải (Solving Mode)</label>
      <select id="modeSelect">
        <option value="stealth">Chế độ Kín (Chỉ gạch chân đáp án đúng)</option>
        <option value="autoclick">Tự động Click (Auto Select)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="humanDelay">Độ trễ giả lập người (giây)</label>
      <input type="number" id="humanDelay" min="0.5" max="10" step="0.5" value="2.0">
    </div>

    <button id="saveBtn" class="btn primary">Lưu Cài Đặt</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="footer">
    <span>Author: Amtia / Phamtin147</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
